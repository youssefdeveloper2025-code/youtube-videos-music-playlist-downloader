name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip flask yt-dlp pyinstaller

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $ff = Get-ChildItem ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) { throw 'ffmpeg.exe was not found in the downloaded archive.' }
          Copy-Item $ff.FullName .\ffmpeg.exe

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name "YT-Downloader-v1.1" --add-data "index.html;." --add-binary "ffmpeg.exe;." launcher.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-v1.1-Windows
          path: dist/YT-Downloader-v1.1.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YT-Downloader-v1.1.exe
          generate_release_notes: true
